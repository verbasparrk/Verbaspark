name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: Browser tests
        run: npm run test:browser -- --workers=1
      - name: Cloud integration tests (mocked)
        run: |
          set -o pipefail
          npm run test:cloud -- --workers=1 2>&1 | tee cloud-test.log
      - name: Report cloud test failure
        if: failure()
        run: |
          if [ -f cloud-test.log ]; then
            node -e "const fs=require('fs');const text=fs.readFileSync('cloud-test.log','utf8').split('\\n').slice(-70).join('\\n').slice(-6000).replaceAll('%','%25').replaceAll('\\r','%0D').replaceAll('\\n','%0A');console.log('::error title=Cloud test failure::'+text)"
          fi
      - name: Production build
        run: npm run build
